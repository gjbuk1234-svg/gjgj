<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026년 지자체 협력사업 신청 및 심사 현황</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">
    <!-- 헤더 -->
    <header class="bg-indigo-600 text-white shadow-md py-6 px-8">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">🏛️ 2026년 지자체 협력사업 통합 포털</h1>
            <span class="bg-indigo-700 text-xs px-3 py-1 rounded-full uppercase tracking-wider font-semibold">Blue Edition</span>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="max-w-7xl mx-auto px-6 py-8 flex-grow w-full space-y-10">
        
        <!-- Google Sheets 임베드 섹션 -->
        <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold text-slate-700">📊 Google Sheets 통합 신청 현황</h2>
                <span class="text-xs text-slate-400">파일 → 공유 → 웹에 게시 → 임베드 코드 연동</span>
            </div>
            <div class="w-full h-[450px] bg-slate-100 rounded-lg overflow-hidden border border-slate-200">
                <!-- Google Sheets 퍼블리시 iframe 주소 -->
                <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSC8IhQsDBVlndKAQ6nYFzgqiG5EYnc184fDjbt5tgtlTccI64xyiL9ryrHFAH1tvBJJcGXdPksfSvU/pubhtml?widget=true&amp;headers=false" width="100%" height="500px"></iframe>
            </div>
        </section>

        <!-- 신청 카드 표시 및 자동 판정 섹션 -->
        <section>
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold text-slate-700">📋 지자체별 사업 신청 카드 & 자동 심사 판정</h2>
                <div class="flex gap-3 text-xs">
                    <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span> 승인 (적정)</span>
                    <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-rose-500 inline-block"></span> 반려 (한도 초과)</span>
                </div>
            </div>
            
            <div id="card-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- JavaScript로 동적 카드 렌더링 -->
            </div>
        </section>
    </main>

    <!-- 푸터 -->
    <footer class="bg-slate-800 text-slate-400 py-6 text-center text-sm">
        <p>&copy; 2026 행정안전부 자치분권과. All rights reserved.</p>
    </footer>

    <!-- 스크립트: 신청목록.json 데이터 기반 렌더링 및 자동 판정 로직 -->
    <script>
        const applications = [
            { "지자체명": "가람군", "인구수": 30000, "신청액": 250000, "예산": 250000, "사업명": "가람군 청년 농촌 정착 지원 사업" },
            { "지자체명": "나봄시", "인구수": 45000, "신청액": 500000, "예산": 500000, "사업명": "나봄시 스마트 관광 플랫폼 구축" },
            { "지자체명": "다솔구", "인구수": 80000, "신청액": 600000, "예산": 600000, "사업명": "다솔구 어르신 디지털 친화 도시 조성" },
            { "지자체명": "라윤시", "인구수": 60000, "신청액": 700000, "예산": 700000, "사업명": "라윤시 도심 보행자 안전망 구축" },
            { "지자체명": "마을군", "인구수": 25000, "신청액": 200000, "예산": 200000, "사업명": "마을군 지역화폐 활성화 사업" },
            { "지자체명": "바람시", "인구수": 100000, "신청액": 950000, "예산": 900000, "사업명": "바람시 친환경 에너지 전환 사업" }, // 예시용 초과 데이터
            { "지자체명": "사계구", "인구수": 55000, "신청액": 600000, "예산": 600000, "사업명": "사계구 청소년 안심 귀가 시스템" },
            { "지자체명": "아현시", "인구수": 70000, "신청액": 650000, "예산": 650000, "사업명": "아현시 도시재생 거점공간 조성" },
            { "지자체명": "자연군", "인구수": 40000, "신청액": 380000, "예산": 380000, "사업명": "자연군 생태관광 마을 조성" },
            { "지자체명": "차돌시", "인구수": 90000, "신청액": 880000, "예산": 850000, "사업명": "차돌시 산업단지 디지털 전환 사업" } // 예시용 초과 데이터
        ];

        const gridContainer = document.getElementById('card-grid');

        applications.forEach(app => {
            // 자동 판정: 신청액이 예산(한도액)을 초과하는지 여부 판정
            const isOverLimit = app.신청액 > app.예산;
            
            // 상태에 따른 스타일 및 텍스트 설정 (승인 / 반려)
            const statusBadge = isOverLimit 
                ? '<span class="bg-rose-100 text-rose-700 text-xs font-bold px-2.5 py-1 rounded-md">반려 (한도초과)</span>'
                : '<span class="bg-emerald-100 text-emerald-700 text-xs font-bold px-2.5 py-1 rounded-md">승인 (적정)</span>';
            
            const borderStyle = isOverLimit 
                ? 'border-l-4 border-l-rose-500 border-slate-200' 
                : 'border-l-4 border-l-emerald-500 border-slate-200';

            const card = document.createElement('div');
            card.className = `bg-white rounded-xl shadow-sm ${borderStyle} border p-6 hover:shadow-md transition-shadow flex flex-col justify-between`;
            card.innerHTML = `
                <div>
                    <div class="flex justify-between items-start mb-3">
                        <span class="bg-indigo-50 text-indigo-700 text-xs font-semibold px-2.5 py-1 rounded-md">${app.지자체명}</span>
                        ${statusBadge}
                    </div>
                    <h3 class="font-bold text-lg text-slate-800 mb-2">${app.사업명}</h3>
                    <p class="text-xs text-slate-400">인구수: ${app.인구수.toLocaleString()}명</p>
                </div>
                <div class="mt-4 pt-4 border-t border-slate-100 space-y-1 text-sm">
                    <div class="flex justify-between">
                        <span class="text-slate-500">신청액</span>
                        <span class="font-semibold text-slate-700">${app.신청액.toLocaleString()} 천원</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-slate-500">기준 예산</span>
                        <span class="font-semibold text-slate-700">${app.예산.toLocaleString()} 천원</span>
                    </div>
                </div>
            `;
            gridContainer.appendChild(card);
        });
    </script>
</body>
</html>
